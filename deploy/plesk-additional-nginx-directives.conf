# docs.loyalty.lt — Plesk "Additional nginx directives"
#
# Paste into: Plesk > Domains > docs.loyalty.lt > Apache & nginx Settings
# > Additional nginx directives. "Proxy mode" OFF.
#
# Plesk already emits server/listen/server_name/root/ssl/logs — don't repeat.
# The pm2 app must be running (ecosystem.config.cjs, port 3098):
#   cd /var/www/vhosts/loyalty.lt/docs.loyalty.lt && ./deploy/deploy.sh

add_header X-Content-Type-Options    "nosniff"            always;
add_header X-Frame-Options           "SAMEORIGIN"         always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Next.js fingerprints everything under /_next/static/ — cache for a year,
# served straight off disk.
location /_next/static/ {
    alias /var/www/vhosts/loyalty.lt/docs.loyalty.lt/.next/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# "Ask AI" streams from the LLM gateway — needs a longer read timeout.
location /api/chat {
    proxy_pass http://127.0.0.1:3098;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
}

location / {
    proxy_pass http://127.0.0.1:3098;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
