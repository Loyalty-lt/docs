# docs.loyalty.lt — Plesk "Additional nginx directives"
#
# Paste the block below into:
#   Plesk > Domains > docs.loyalty.lt > Apache & nginx Settings
#   > Additional nginx directives
#
# Plesk already emits `server {}`, `listen`, `server_name`, `root`, the SSL
# certificate lines and the access/error logs, so none of those appear here —
# redeclaring them makes nginx refuse to reload.
#
# Prerequisites in the same screen:
#   * "Proxy mode" (Apache proxying)          -> OFF, so nginx serves directly
#   * "Serve static files directly by nginx"  -> may stay ON; the location
#                                                blocks below take precedence
#
# The pm2 app must be running first (ecosystem.config.cjs, port 3098):
#   cd /var/www/vhosts/loyalty.lt/docs.loyalty.lt && ./deploy/deploy.sh
#
# ---------------------------------------------------------------------------

# --- security headers ------------------------------------------------------
add_header X-Content-Type-Options    "nosniff"            always;
add_header X-Frame-Options           "SAMEORIGIN"         always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --- static assets straight off disk ---------------------------------------
# Docusaurus fingerprints everything under /assets/, so a year is safe and the
# node process never sees these requests.
location /assets/ {
    alias /var/www/vhosts/loyalty.lt/docs.loyalty.lt/build/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /img/ {
    alias /var/www/vhosts/loyalty.lt/docs.loyalty.lt/build/img/;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# The OpenAPI spec is pulled by external tooling (Postman imports, codegen),
# so it needs CORS and only a short cache.
location = /api-reference/openapi.json {
    alias /var/www/vhosts/loyalty.lt/docs.loyalty.lt/build/api-reference/openapi.json;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=300";
    default_type application/json;
}

# --- chat proxy (server/chat-proxy.mjs on :3102) ---------------------------
# Same-origin only: the browser never talks to ai.loyalty.lt or holds a key.
location /api/chat {
    proxy_pass http://127.0.0.1:3102;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The upstream LLM call can take a while; give it more room than the
    # default page proxy_read_timeout.
    proxy_read_timeout 35s;
}

# --- everything else -> pm2 (docusaurus serve on :3098) --------------------
location / {
    proxy_pass http://127.0.0.1:3098;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    # HTML must not be cached hard, or a deploy leaves stale pages behind.
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

# --- compression -----------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
