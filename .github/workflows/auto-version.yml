name: Auto Version Bump

# Tas pats principas kaip api.loyalty.lt, tik versija gyvena package.json, ne
# VERSION faile: `npm version` atnaujina ir package-lock.json, tad abu failai
# lieka sutampantys.
#
#   breaking: / feat!: / BREAKING  -> major
#   feat: / feature:               -> minor
#   visa kita (fix:, chore: ...)   -> patch

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: auto-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    # Praleidžiam paties workflow'o commit'ą, kitaip jis kviestų pats save.
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump type from commit message
        id: bump
        run: |
          MSG="${{ github.event.head_commit.message }}"
          TYPE="patch"
          if echo "$MSG" | grep -qiE '(^|\s)(breaking|major)(:|\s|!)'; then
            TYPE="major"
          elif echo "$MSG" | grep -qiE '^(feat|feature)(\(.+\))?:'; then
            TYPE="minor"
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Bump type: $TYPE"

      - name: Bump package.json
        id: next
        run: |
          NEXT=$(npm version "${{ steps.bump.outputs.type }}" --no-git-tag-version --allow-same-version | tr -d 'v[:space:]')
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT"

      - name: Commit and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json 2>/dev/null || git add package.json
          git commit -m "chore: bump version to ${{ steps.next.outputs.version }} [skip ci]"
          git tag "v${{ steps.next.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.next.outputs.version }}"
